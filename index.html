<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1417">
<title>Montenegro · 29 Aug to 5 Sep 2026</title>
<style>html,body{margin:0;background:#0f1417;color:#e8eef1;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center}#s{opacity:.82;padding:24px;text-align:center}</style>
</head>
<body><div id="s">Loading Montenegro…</div>
<script>
(async()=>{
  try{
    const parts=[...Array(12)].map((_,i)=>`g${String(i).padStart(2,'0')}.b64`);
    const texts=await Promise.all(parts.map(async p=>{
      const r=await fetch(p,{cache:'no-store'});
      if(!r.ok) throw new Error(`${p}: ${r.status}`);
      return r.text();
    }));
    const b64=texts.join('').replace(/\s/g,'');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    if(!('DecompressionStream' in window)) throw new Error('This browser is too old to open the page.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('s').textContent='Could not load the itinerary: '+e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
