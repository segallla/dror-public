<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071d4d"><title>MORE Power Fund I — Scenario Model</title><style>html,body{margin:0;background:#eef2f6;color:#15223b;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center}#s{padding:24px;text-align:center;font-weight:700;color:#071d4d}</style></head><body><div id="s">Loading MORE Power Fund I…</div><script>(async()=>{try{const parts=[...Array(4)].map((_,i)=>`p${String(i).padStart(2,'0')}.b64`);const texts=await Promise.all(parts.map(async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(`${p}: ${r.status}`);return r.text();}));const b64=texts.join('').replace(/\s/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream' in window))throw new Error('This browser is too old to open the model.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(e){document.getElementById('s').textContent='Could not load the model: '+e.message;console.error(e);}})();</script></body></html>
