name: Temporary Netlify deploy - Power Constraint Game

on:
  push:
    paths:
      - '.github/workflows/netlify-power-constraint-20260821.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out temporary payload
        uses: actions/checkout@v4

      - name: Reconstruct and verify site
        shell: bash
        run: |
          mkdir -p site
          cat .netlify-power-constraint-20260821/chunk*.b64 | base64 --decode | gzip --decompress > site/index.html
          test "$(sha1sum site/index.html | awk '{print $1}')" = "dc80c1aae1b1cf198118df05e2d8013dd5ee22f0"

      - name: Deploy anonymously to Netlify
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const API = 'https://api.netlify.com/api/v1';
          const REFERRER = 'https://app.netlify.com';
          const UA = 'stage-energy-chatgpt-netlify-deployer/1.0';
          const file = fs.readFileSync('site/index.html');
          const hash = crypto.createHash('sha1').update(file).digest('hex');

          function headers(extra = {}) {
            return { 'User-Agent': UA, Referer: REFERRER, ...extra };
          }

          async function checked(response, label) {
            const text = await response.text();
            if (!response.ok) {
              throw new Error(`${label}: ${response.status} ${response.statusText} ${text}`);
            }
            return text ? JSON.parse(text) : {};
          }

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            const { token } = await checked(
              await fetch(`${API}/drop/token`, {
                method: 'POST',
                headers: headers({ 'Content-Type': 'application/json' }),
              }),
              'get drop token',
            );

            const info = await checked(
              await fetch(`${API}/drop`, {
                method: 'POST',
                headers: headers({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({
                  files: { 'index.html': hash },
                  token,
                  created_via: 'cli',
                }),
              }),
              'create drop deploy',
            );

            if ((info.required || []).includes(hash)) {
              await checked(
                await fetch(`${API}/deploys/${info.deploy_id}/files/index.html`, {
                  method: 'PUT',
                  headers: headers({
                    'Content-Type': 'application/octet-stream',
                    Authorization: `Bearer ${token}`,
                  }),
                  body: file,
                }),
                'upload index.html',
              );
            }

            let deploy;
            for (let attempt = 0; attempt < 60; attempt += 1) {
              const response = await fetch(
                `${API}/sites/${info.id}/deploys/${info.deploy_id}`,
                { headers: headers() },
              );
              if (response.ok) {
                deploy = await response.json();
                if (deploy.state === 'ready') break;
                if (deploy.state === 'error') {
                  throw new Error(deploy.error_message || 'Netlify deploy failed');
                }
              }
              await sleep(2000);
            }

            if (!deploy || deploy.state !== 'ready') {
              throw new Error('Timed out waiting for Netlify deploy');
            }

            const siteUrl = deploy.ssl_url || deploy.url || `https://${info.subdomain}.netlify.app`;
            const claimUrl = `https://app.netlify.com/drop/${info.subdomain}#drop_token=${token}`;
            const result = {
              site_id: info.id,
              deploy_id: info.deploy_id,
              site_url: siteUrl,
              claim_url: claimUrl,
            };

            console.log(`NETLIFY_RESULT=${JSON.stringify(result)}`);
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `## Netlify deploy complete\n\n- Live site: ${siteUrl}\n- Claim project: ${claimUrl}\n`,
            );
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
